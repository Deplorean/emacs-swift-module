name: Native Swift plugin
on:
  push:
    branches: [main, feat/swift-native-plugin]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '27.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify official toolchain and language behavior
        run: bash scripts/verify-toolchain.sh
      - name: Install real Emacs
        run: |
          brew install emacs
          emacs --version
          emacs --batch -Q --eval '(unless module-file-suffix (error "Emacs lacks dynamic modules"))'
      - name: Compile package with strict concurrency
        run: swift build -Xswiftc -warnings-as-errors
      - name: Load and test the native plugin (debug)
        run: bash Examples/HelloPlugin/run-native-tests.sh debug
      - name: Load and test the native plugin (release)
        run: bash Examples/HelloPlugin/run-native-tests.sh release
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-verification
          path: |
            .build/toolchain-verification
            Examples/HelloPlugin/.build/test-results
          if-no-files-found: warn
